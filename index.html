    <script>
      (function() {
        // التقاط حدث تثبيت التطبيق مبكراً قبل تحميل React لضمان عمل زر التثبيت من أول لحظة
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__deferredPwaPrompt = e;
        });

        try {
          var theme = localStorage.getItem('sharaya_theme_v2');
          if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}

        // تطهير فوري لأي كاش قديم في Service Worker قد يحتفظ باستجابات API قديمة
        try {
          if ('caches' in window) {
            window.caches.keys().then(function(keys) {
              keys.forEach(function(key) {
                if (key !== 'sharaya-clinics-v31') {
                  window.caches.delete(key);
                } else {
                  window.caches.open(key).then(function(cache) {
                    cache.keys().then(function(requests) {
                      requests.forEach(function(req) {
                        if (req.url.indexOf('/api/') !== -1 || req.url.indexOf('/rest/v1') !== -1) {
                          cache.delete(req);
                        }
                      });
                    });
                  });
                }
              });
            });
          }
          if (localStorage.getItem('sharaya_sw_purge_v13') !== 'done') {
            localStorage.setItem('sharaya_sw_purge_v13', 'done');
            localStorage.removeItem('sharaya_clinics_v2');
            localStorage.removeItem('sharaya_doctors_v2');
            localStorage.removeItem('sharaya_bookings_v2');
            localStorage.removeItem('sharaya_daily_schedule_v2');
            localStorage.removeItem('sharaya_staff_accounts_v2');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(reg) {
                  reg.update();
                });
              });
            }
          }
        } catch (e) {}

        window.addEventListener('vite:preloadError', function() {
          window.location.reload();
        });
      })();
    </script>
