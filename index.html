<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="عيادات الجمعية" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>عيادات الجمعية الشرعية</title>
    <meta name="description" content="منظومة رقمية متقدمة لإدارة حجوزات وأدوار عيادات الجمعية الشرعية التخصصية بتجربة PWA متكاملة" />
    <meta property="og:title" content="عيادات الجمعية الشرعية" />
    <meta property="og:description" content="منظومة رقمية متقدمة لإدارة حجوزات وأدوار عيادات الجمعية الشرعية التخصصية بتجربة PWA متكاملة" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#064E3B" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('sharaya_theme_v2');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}

        // تطهير فوري لأي كاش قديم في Service Worker قد يحتفظ باستجابات API قديمة
        try {
          if ('caches' in window) {
            window.caches.keys().then(function(keys) {
              keys.forEach(function(key) {
                if (key !== 'sharaya-clinics-v8') {
                  window.caches.delete(key);
                } else {
                  window.caches.open(key).then(function(cache) {
                    cache.keys().then(function(requests) {
                      requests.forEach(function(req) {
                        if (req.url.indexOf('/api/') !== -1 || req.url.indexOf('/rest/v1') !== -1) {
                          cache.delete(req);
                        }
                      });
                    });
                  });
                }
              });
            });
          }
          if (localStorage.getItem('sharaya_sw_purge_v8') !== 'done') {
            localStorage.setItem('sharaya_sw_purge_v8', 'done');
            localStorage.removeItem('sharaya_clinics_v2');
            localStorage.removeItem('sharaya_doctors_v2');
            localStorage.removeItem('sharaya_bookings_v2');
            localStorage.removeItem('sharaya_daily_schedule_v2');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(reg) {
                  reg.update();
                });
              });
            }
          }
        } catch (e) {}

        window.addEventListener('vite:preloadError', function() {
          window.location.reload();
        });
      })();
    </script>
  </head>
  <body class="bg-[#F7FAF8] dark:bg-[#06110E] text-slate-900 dark:text-slate-100 antialiased selection:bg-emerald-800 selection:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
